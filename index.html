<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Resource Coffee House</title>
      <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,600&display=swap"
        rel="stylesheet"
      >
      <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header class="header">
      <div class="wrapper">
        <a class="logo" href="./index.html" aria-label="Resource Coffee House home">
          <img
            class="logo-img logo-light"
            src="./assets/images/logo.png"
            alt="logo light"
            width="100"
            height="60"
          >
          <img
            class="logo-img logo-dark"
            src="./assets/images/logo-dark.png"
            alt="logo dark"
            width="100"
            height="60"
          >
        </a>

        <nav class="nav" aria-label="Main navigation">
          <ul class="nav-list">
            <li><a class="nav-link" href="#favorite-coffee">Favorite coffee</a></li>
            <li><a class="nav-link" href="#about">About</a></li>
            <li><a class="nav-link" href="#mobile-app">Mobile app</a></li>
            <li><a class="nav-link" href="#contact-us">Contact us</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <span class="theme-btn theme-btn-active" data-theme="light">
              <img src="./assets/icons/sun.svg" alt="theme button light" width="22" height="22">
            </span>
            <span class="theme-btn" data-theme="dark">
              <img src="./assets/icons/moon.svg" alt="theme button dark" width="18" height="18">
            </span>
          </button>

          <a class="menu-link" href="./catalog.html">
            <span>Menu</span>
            <img
              class="icon"
              src="./assets/icons/coffee-cup.svg"
              alt="menu button"
              width="20"
              height="20"
            >
          </a>

          <button class="burger" type="button" aria-label="Open menu">
            <img
              class="icon"
              src="./assets/icons/burger-menu.svg"
              alt="burger menu button"
              width="16"
              height="16"
            >
          </button>
        </div>
      </div>
    </header>
  </body>
</html>
