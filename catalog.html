<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Resource Coffee House</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./css/style.css">
    <script>
      let savedTheme = localStorage.getItem("coffee-house-theme");

      if (savedTheme !== "dark") {
        savedTheme = "light";
      }

      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
  </head>
  <body>
    <header class="header">
      <div class="wrapper">
        <a class="logo" href="./index.html" aria-label="Resource Coffee House home">
          <img
            class="logo-img logo-light"
            src="./assets/images/logo.png"
            alt="Resource"
            width="100"
            height="60"
          >
          <img
            class="logo-img logo-dark"
            src="./assets/images/logo-dark.png"
            alt="Resource"
            width="100"
            height="60"
          >
        </a>

        <nav class="nav" aria-label="Main navigation">
          <ul class="nav-list">
            <li>
              <a class="nav-link" href="./index.html#favorite-coffee">Favorite coffee</a>
            </li>
            <li><a class="nav-link" href="./index.html#about">About</a></li>
            <li><a class="nav-link" href="./index.html#mobile-app">Mobile app</a></li>
            <li><a class="nav-link" href="#contact-us">Contact us</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <span class="theme-btn theme-btn-active" data-theme="light">
              <img src="./assets/icons/sun.svg" alt="" width="22" height="22">
            </span>
            <span class="theme-btn" data-theme="dark">
              <img src="./assets/icons/moon.svg" alt="" width="18" height="18">
            </span>
          </button>

          <span class="menu-link menu-link-active" aria-current="page">
            <span>Menu</span>
            <img
              class="icon"
              src="./assets/icons/coffee-cup.svg"
              alt=""
              width="20"
              height="20"
            >
          </span>

          <button class="burger" type="button" aria-label="Open menu">
            <span class="burger-line"></span>
            <span class="burger-line"></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <div class="wrapper">
        <section class="menu" aria-labelledby="menu-heading">
          <h1 class="menu-heading" id="menu-heading">
            Behind each of our cups hides an
            <span class="accent">amazing surprise</span>
          </h1>

          <ul class="tabs" role="tablist" aria-label="Menu categories">
            <li role="presentation">
              <button
                class="tab tab-active"
                type="button"
                role="tab"
                data-category="coffee"
                aria-selected="true"
              >
                <span class="tab-icon" aria-hidden="true">
                  <img
                    class="icon"
                    src="./assets/icons/coffee-cup.svg"
                    alt="coffee cup icon"
                    width="16"
                    height="16"
                  >
                </span>
                <span>Coffee</span>
              </button>
            </li>
            <li role="presentation">
              <button
                class="tab"
                type="button"
                role="tab"
                data-category="tea"
                aria-selected="false"
                tabindex="-1"
              >
                <span class="tab-icon" aria-hidden="true">
                  <img
                    class="icon"
                    src="./assets/images/tea-tab.png"
                    alt="tea icon"
                    width="16"
                    height="16"
                  >
                </span>
                <span>Tea</span>
              </button>
            </li>
            <li role="presentation">
              <button
                class="tab"
                type="button"
                role="tab"
                data-category="dessert"
                aria-selected="false"
                tabindex="-1"
              >
                <span class="tab-icon" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path
                      d="M3 10c0-2 2-3 5-3s5 1 5 3v1H3v-1Z"
                      stroke="#403F3D"
                      stroke-width="1.2"
                    />
                    <path
                      d="M5 7.5C5 5.5 6.2 4 8 4s3 1.5 3 3.5"
                      stroke="#403F3D"
                      stroke-width="1.2"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <span>Dessert</span>
              </button>
            </li>
          </ul>

          <ul class="products"></ul>

          <button class="load-more" type="button" aria-label="Load more products">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M21 12a9 9 0 1 1-2.64-6.36"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <path
                d="M21 3v6h-6"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </section>
      </div>
    </main>

    <div class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-window" role="dialog" aria-modal="true" aria-label="Product details">
        <button class="modal-close" type="button" aria-label="Close">
          <span class="modal-close-line"></span>
          <span class="modal-close-line"></span>
        </button>
        <div class="modal-body"></div>
      </div>
    </div>

    <div class="wrapper">
      <footer class="footer" id="contact-us">
        <div class="footer-offer">
          <h2 class="footer-heading">
            Sip, Savor, Smile.<br>
            <span class="accent">It’s coffee time!</span>
          </h2>
          <ul class="social">
            <li>
              <a
                class="social-link"
                href="https://twitter.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Twitter"
              >
                <img src="./assets/icons/twitter.svg" alt="x icon" width="24" height="24">
              </a>
            </li>
            <li>
              <a
                class="social-link"
                href="https://www.instagram.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
              >
                <img src="./assets/icons/instagram.svg" alt="instagram icon" width="24" height="24">
              </a>
            </li>
            <li>
              <a
                class="social-link"
                href="https://www.facebook.com"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
              >
                <img src="./assets/icons/facebook.svg" alt="facebook icon" width="24" height="24">
              </a>
            </li>
          </ul>
        </div>

        <div class="footer-contacts">
          <h2 class="footer-contacts-heading">Contact us</h2>
          <ul class="contacts">
            <li>
              <a
                class="contact-link"
                href="https://maps.google.com/?q=8558+Green+Rd+LA"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img src="./assets/icons/pin-alt.svg" alt="location icon" width="20" height="20">
                <span>8558 Green Rd., LA</span>
              </a>
            </li>
            <li>
              <a class="contact-link" href="tel:+16035550123">
                <img src="./assets/icons/phone.svg" alt="phone icon" width="20" height="20">
                <span>+1 (603) 555-0123</span>
              </a>
            </li>
            <li class="contact-item">
              <img src="./assets/icons/clock.svg" alt="clock icon" width="20" height="20">
              <span>Mon–Sat: 9:00 AM – 23:00 PM</span>
            </li>
          </ul>
        </div>
      </footer>
    </div>
    <script src="./js/theme.js"></script>
    <script src="./js/burger.js"></script>
    <script src="./js/menu.js"></script>
  </body>
</html>
